# Newbernetes · Episode 8 · Rolling back the right way
# The starting file for the rollback demo: two copies of nginx 1.27.
# Commit it to Git before you start, so you have a history to roll back through.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
