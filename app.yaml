# Newbernetes · Episode 10 · Storage
# Part 2: a tiny app that mounts the claim at /data.
# Apply:   kubectl apply -f app.yaml
# Remove:  kubectl delete -f app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: storage-demo
  labels:
    app: notes
spec:
  replicas: 1
  strategy:
    type: Recreate                 # stop the old pod before starting a new one, so only one pod uses the disk
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]   # just stay running
          volumeMounts:
            - name: data
              mountPath: /data     # where the storage shows up inside the container
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-data  # the claim from claim.yaml
